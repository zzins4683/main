<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SSR Mercury Robotics — AI · Robotics · Automation" />
  <title>SSR | Mercury Robotics </title>

  <style>
    :root {
      --ssr-blue: #1557bd;
      --ssr-deep: #07162f;
      --gold: #b99a55;
      --white: #ffffff;
      --line: rgba(255,255,255,.22);
      --header-height: 78px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #111;
      background: #fff;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    /* 상단 알림 바 */
    .notice {
      min-height: 42px;
      padding: 0 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: #fff;
      background: var(--ssr-blue);
      font-size: 14px;
      font-weight: 700;
    }
    .notice a {
      border-bottom: 1px solid rgba(255,255,255,.7);
      margin-left: 10px;
      font-weight: 500;
    }

    /* 히어로 */
    .hero {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(4,13,30,.64) 0%, rgba(4,13,30,.25) 42%, rgba(4,13,30,.06) 75%),
        url("assets/ssr-hero.jpg") center center / cover no-repeat;
    }

    /* PC 화면에서는 원본 구도를 최대한 유지 */
    @media (min-width: 1100px) {
      .hero {
        background-position: center center;
      }
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 28%;
      background: linear-gradient(transparent, rgba(3,10,24,.55));
      z-index: -1;
    }

    /* 내비게이션 */
    .site-header {
      height: var(--header-height);
      padding: 0 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      color: #fff;
      border-bottom: 1px solid var(--line);
      background: rgba(5,15,34,.28);
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
    }
    .brand-mark {
      font-size: 31px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -3px;
      color: #fff;
    }
    .brand-mark span { color: #91b8ff; }
    .brand-copy small {
      display: block;
      font-size: 10px;
      letter-spacing: 1.4px;
      opacity: .76;
    }
    .brand-copy strong {
      display: block;
      font-size: 14px;
      letter-spacing: .5px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 2.4vw, 38px);
      margin-left: auto;
      font-size: 15px;
      font-weight: 700;
    }
    .nav a {
      position: relative;
      padding: 29px 0 25px;
      white-space: nowrap;
    }
    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 18px;
      width: 0;
      height: 2px;
      background: #fff;
      transition: width .25s ease;
    }
    .nav a:hover::after { width: 100%; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
    }
    .outline-btn {
      border: 1px solid rgba(255,255,255,.65);
      color: #fff;
      background: rgba(0,0,0,.12);
      padding: 10px 14px;
      cursor: pointer;
    }
    .erp-link { white-space: nowrap; }
    .menu-btn {
      width: 42px;
      height: 42px;
      border: 0;
      color: #fff;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
    }

    /* 메인 카피 */
    .hero-content {
      min-height: calc(100vh - var(--header-height) - 42px);
      padding: 7vh 7vw 9vh;
      display: flex;
      align-items: center;
    }

    .copy {
      width: min(620px, 48vw);
      margin-top: 4vh;
      color: #fff;
      text-shadow: 0 3px 22px rgba(0,0,0,.35);
    }
    .eyebrow {
      margin: 0 0 18px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #bcd4ff;
    }
    h1 {
      margin: 0;
      font-size: clamp(40px, 5.1vw, 78px);
      line-height: .98;
      letter-spacing: -3px;
      font-weight: 900;
    }
    h1 span {
      display: block;
      margin-top: 12px;
      font-size: .56em;
      line-height: 1.15;
      letter-spacing: -1px;
      font-weight: 700;
    }
    .lead {
      max-width: 540px;
      margin: 25px 0 0;
      font-size: clamp(15px, 1.2vw, 18px);
      line-height: 1.75;
      color: rgba(255,255,255,.88);
    }
    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 31px;
    }
    .cta {
      min-width: 150px;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,.72);
      color: #fff;
      background: rgba(3,12,28,.28);
      font-weight: 800;
      text-align: center;
      transition: .2s ease;
    }
    .cta.primary {
      border-color: var(--ssr-blue);
      background: var(--ssr-blue);
    }
    .cta:hover {
      transform: translateY(-2px);
      background: #fff;
      border-color: #fff;
      color: var(--ssr-deep);
    }

    .scroll-guide {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.82);
      font-size: 11px;
      letter-spacing: 2px;
      text-align: center;
    }
    .scroll-guide::after {
      content: "";
      display: block;
      width: 1px;
      height: 34px;
      margin: 9px auto 0;
      background: rgba(255,255,255,.65);
    }

    /* 아래 섹션 뼈대 */
    .section {
      padding: 105px 7vw;
    }
    .section:nth-of-type(even) { background: #f5f7fa; }
    .section-label {
      margin: 0 0 12px;
      color: var(--ssr-blue);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
    }
    .section h2 {
      margin: 0 0 24px;
      font-size: clamp(31px, 4vw, 54px);
      letter-spacing: -2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 22px;
      margin-top: 42px;
    }
    .card {
      min-height: 220px;
      padding: 28px;
      border: 1px solid #dde3eb;
      background: #fff;
    }
    .card b {
      display: block;
      margin-bottom: 15px;
      font-size: 22px;
    }
    .card p {
      margin: 0;
      line-height: 1.7;
      color: #5e6774;
    }

    footer {
      padding: 38px 7vw;
      color: rgba(255,255,255,.72);
      background: #071326;
      font-size: 13px;
    }

    /* 모바일 */
    @media (max-width: 980px) {
      .nav, .outline-btn:not(.erp-link) { display: none; }

      .hero {
        background-position: 58% center;
      }
      .hero-content {
        align-items: flex-end;
        padding-bottom: 110px;
      }
      .copy {
        width: min(620px, 100%);
      }
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .notice {
        padding: 10px 20px;
        align-items: flex-start;
        font-size: 12px;
      }
      .notice span:last-child { display: none; }

      .site-header { padding: 0 20px; }
      .brand-copy { display: none; }

      .hero {
        min-height: 820px;
        background-position: 62% center;
      }
      .hero-content {
        min-height: 700px;
        padding: 40px 22px 80px;
      }
      h1 { letter-spacing: -2px; }
      .lead { max-width: 92%; }
      .hero-cta { gap: 8px; }
      .cta { min-width: 132px; padding: 12px 15px; }
      .section { padding: 72px 22px; }
    }

    body { background: #f3f6fb; }
    .notice {
      min-height: 38px;
      background: #10233f;
      font-size: 12px;
    }
    .notice a { display: none; }
    .hero {
      min-height: calc(100vh - 38px);
      background:
        linear-gradient(90deg, rgba(4,13,30,.78) 0%, rgba(4,13,30,.48) 48%, rgba(4,13,30,.18) 100%),
        url("assets/ssr-hero.jpg") center center / cover no-repeat;
    }
    .hero::after { display: none; }
    .site-header {
      height: 72px;
      background: transparent;
      border-bottom-color: rgba(255,255,255,.16);
    }
    .nav, .header-actions { display: none; }
    .hero-content {
      min-height: calc(100vh - 110px);
      padding: 64px 7vw 80px;
      align-items: flex-start;
      justify-content: flex-start;
    }
    .copy {
      width: min(100%, 900px);
      margin: 2vh 0 0;
    }
    .eyebrow { margin-bottom: 12px; }
    h1 { font-size: clamp(38px, 5vw, 58px); letter-spacing: -2px; }
    h1 span { margin-top: 12px; font-size: .42em; letter-spacing: -1px; }
    .lead { margin-top: 18px; }
    .hero-cta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 34px;
    }
    .cta {
      min-height: 74px;
      padding: 18px 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 0;
      background: rgba(3,12,28,.5);
      text-align: left;
      font-size: 16px;
      transition: background .2s ease, color .2s ease;
    }
    .cta.primary { border-color: var(--ssr-blue); background: var(--ssr-blue); color: #fff; }
    .cta:hover { background: #fff; border-color: #fff; color: var(--ssr-deep); }
    .cta small { margin-left: auto; font-size: 12px; font-weight: 500; opacity: .76; white-space: nowrap; }
    .scroll-guide { display: none; }
    .section, footer { display: none; }

    @media (max-width: 600px) {
      .notice { padding: 10px 20px; }
      .site-header { padding: 0 22px; }
      .brand-copy { display: block; }
      .hero { min-height: calc(100vh - 38px); }
      .hero-content { min-height: calc(100vh - 110px); padding: 48px 22px 56px; }
      .hero-cta { grid-template-columns: 1fr; gap: 8px; margin-top: 28px; }
      .cta { min-height: 64px; padding: 15px 16px; }
    }
  </style>
</head>

<body>
  <div class="notice">
    <span>SSR 업무 대시보드</span>
    <span>필요한 업무 서비스를 빠르게 열어보세요</span>
  </div>

  <main class="hero" id="home">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="SSR 홈">
        <div class="brand-mark">SS<span>R★</span></div>
        <div class="brand-copy">
          <strong>SSR 업무 대시보드</strong>
          <small>BUSINESS DASHBOARD</small>
        </div>
      </a>
    </header>

    <div class="hero-content">
      <section class="copy">
        <p class="eyebrow">WORKSPACE</p>
        <h1>업무 바로가기<span>자주 사용하는 업무 서비스를 한곳에서 이용하세요.</span></h1>
        <div class="hero-cta">
          <a class="cta primary" href="https://ebook.iquest.co.kr/" target="_blank" rel="noopener noreferrer">얼마에요 4.0 ERP <small>새 창에서 열기 ↗</small></a>
          <a class="cta" href="https://works365.co.kr/view/login" target="_blank" rel="noopener noreferrer">전자결재 <small>새 창에서 열기 ↗</small></a>
          <a class="cta" href="https://office.iquest.co.kr/account/login.do">웹메일</a>
          <a class="cta" href="https://naver.worksmobile.com/" target="_blank" rel="noopener noreferrer">일정 및 메신저 <small>새 창에서 열기 ↗</small></a>
          <a class="cta" href="/quote/" target="_blank" rel="noopener noreferrer">디지털 견적 <small>새 창에서 열기 ↗</small></a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
